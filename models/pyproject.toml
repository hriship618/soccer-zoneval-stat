[project]
name = "zcpv"
version = "0.1.0"
description = "PIVOT — Player Impact via Outcomes and Tracking research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scikit-learn>=1.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zcpv*"]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13.0"]
dev = ["pytest>=8.0"]
